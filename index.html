<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Krazy-view | Full Workspace</title>
    <style>
        :root {
            --bg: #050505;
            --panel: #161616;
            --accent: #ff0000;
            --handle-size: 6px;
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background: var(--bg);
            color: white;
            font-family: 'Segoe UI', system-ui, sans-serif;
            overflow: hidden;
        }

        header {
            height: 60px; background: #000;
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 20px; border-bottom: 1px solid #333;
            z-index: 1000; position: relative;
        }

        .nav-group { display: flex; gap: 8px; align-items: center; }

        button {
            background: #222; color: white; border: 1px solid #444;
            padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px;
        }

        button:hover { background: #333; border-color: var(--accent); }

        #addBtn { background: var(--accent); border: none; font-weight: bold; padding: 8px 18px; }

        #workspace {
            width: 100vw; height: calc(100vh - 60px);
            position: relative; overflow: auto;
        }

        /* The Window */
        .v-window {
            position: absolute; background: var(--panel); border: 1px solid #333;
            min-width: 320px; min-height: 240px;
            display: flex; flex-direction: column;
            box-shadow: 0 10px 40px rgba(0,0,0,0.7);
            transition: left 0.3s ease, top 0.3s ease, width 0.3s ease, height 0.3s ease;
        }

        .v-window.pip-mode {
            position: fixed !important; bottom: 20px !important; right: 20px !important;
            left: auto !important; top: auto !important;
            width: 350px !important; height: 200px !important;
            z-index: 9999 !important; border: 2px solid var(--accent);
        }

        .v-window.no-transition { transition: none !important; }

        .v-header {
            background: #222; height: 32px;
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 10px; cursor: move; font-size: 11px; color: #aaa;
        }

        .header-left { display: flex; align-items: center; gap: 8px; }
        .back-btn { background: #444; border: none; color: white; padding: 2px 8px; border-radius: 3px; display: none; cursor: pointer; font-size: 10px; }
        .header-controls { display: flex; gap: 8px; align-items: center; }
        .pip-btn { color: #3ea6ff; cursor: pointer; border: none; background: none; font-size: 14px; }
        .close-btn { color: #ff5f56; cursor: pointer; border: none; background: none; font-size: 18px; }

        .v-content { flex-grow: 1; background: #000; position: relative; overflow: hidden; }
        
        /* Search UI */
        .search-container { display: flex; flex-direction: column; height: 100%; padding: 10px; box-sizing: border-box; }
        .search-bar { display: flex; gap: 5px; margin-bottom: 10px; }
        .search-bar input { flex-grow: 1; background: #111; border: 1px solid #444; color: white; padding: 8px; border-radius: 4px; outline: none; }
        .results-list { flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .search-item { display: flex; gap: 10px; cursor: pointer; padding: 8px; border-radius: 4px; background: #222; align-items: center; }
        .search-item:hover { background: #333; border-left: 3px solid var(--accent); }
        .search-item img { width: 80px; height: 45px; border-radius: 4px; object-fit: cover; }
        .search-item div { font-size: 12px; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; }

        iframe { width: 100%; height: 100%; border: none; }

        /* Resizers */
        .resizer { position: absolute; background: transparent; z-index: 10; }
        .resizer.n { top: -4px; left: 0; right: 0; height: 8px; cursor: n-resize; }
        .resizer.s { bottom: -4px; left: 0; right: 0; height: 8px; cursor: s-resize; }
        .resizer.e { top: 0; bottom: 0; right: -4px; width: 8px; cursor: e-resize; }
        .resizer.w { top: 0; bottom: 0; left: -4px; width: 8px; cursor: w-resize; }
        .resizer.se { bottom: -5px; right: -5px; width: 15px; height: 15px; cursor: se-resize; }
        .resizer.sw { bottom: -5px; left: -5px; width: 15px; height: 15px; cursor: sw-resize; }
        .resizer.ne { top: -5px; right: -5px; width: 15px; height: 15px; cursor: ne-resize; }
        .resizer.nw { top: -5px; left: -5px; width: 15px; height: 15px; cursor: nw-resize; }

        .overlay-active iframe { pointer-events: none; }
    </style>
</head>
<body>

<header>
    <div style="font-weight: 900; font-size: 1.2rem;">KRAZY <span style="color: var(--accent);">View </span></div>
    <div class="nav-group">
        <button onclick="applyLayout(2, 2)">2x2 Grid</button>
        <button onclick="applyLayout(3, 2)">3x2 Grid</button>
        <button id="addBtn">+ New Window</button>
    </div>
</header>

<div id="workspace"></div>

<script>
    const YOUTUBE_API_KEY = 'AIzaSyDfuubS8InUZRRZDezphqbhuuZeKGTh7Tk'; 
    const workspace = document.getElementById('workspace');
    let topZ = 100;
    const historyCache = {}; 

    document.getElementById('addBtn').onclick = () => {
        const id = Date.now();
        const win = document.createElement('div');
        win.className = 'v-window';
        win.style.left = '80px'; win.style.top = '80px';
        win.style.width = '480px'; win.style.height = '320px';
        win.style.zIndex = ++topZ;

        win.innerHTML = `
            <div class="v-header">
                <div class="header-left">
                    <button id="back-${id}" class="back-btn" onclick="goBack('${id}')">← Back</button>
                    <span id="t-${id}">Search</span>
                </div>
                <div class="header-controls">
                    <button class="pip-btn" onclick="togglePiP(this.closest('.v-window'))">🔲</button>
                    <button class="close-btn" onclick="this.closest('.v-window').remove()">×</button>
                </div>
            </div>
            <div class="v-content" id="c-${id}">
                <div class="search-container" id="search-ui-${id}">
                    <div class="search-bar">
                        <input type="text" id="q-${id}" placeholder="Search YouTube or paste Link...">
                        <button onclick="handleInput('${id}')">Go</button>
                    </div>
                    <div class="results-list" id="r-${id}">
                        <div style="text-align:center; padding-top:20%; color:#555;">Discover and Multitask</div>
                    </div>
                </div>
            </div>
            <div class="resizer n"></div><div class="resizer s"></div>
            <div class="resizer e"></div><div class="resizer w"></div>
            <div class="resizer ne"></div><div class="resizer nw"></div>
            <div class="resizer se"></div><div class="resizer sw"></div>
        `;

        win.onmousedown = () => { if(!win.classList.contains('pip-mode')) win.style.zIndex = ++topZ; };
        initDrag(win);
        initResize(win);
        workspace.appendChild(win);
    };

    async function handleInput(id) {
        const queryInput = document.getElementById(`q-${id}`);
        const query = queryInput.value.trim();
        const resultsDiv = document.getElementById(`r-${id}`);
        
        const yt = query.match(/(?:youtu\.be\/|youtube\.com(?:\/embed\/|\/v\/|\/watch\?v=))([\w\-]{11})/);
        const tw = query.match(/twitch\.tv\/([a-zA-Z0-9_]+)/);

        if (yt) { loadPlayer(id, 'youtube', yt[1]); return; }
        if (tw) { loadPlayer(id, 'twitch', tw[1]); return; }

        if (YOUTUBE_API_KEY === 'YOUR_YOUTUBE_API_KEY') {
            alert("Enter your YouTube API Key in the code script!");
            return;
        }

        resultsDiv.innerHTML = "<div style='text-align:center; color:#888;'>Searching YouTube...</div>";
        try {
            const resp = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=8&q=${encodeURIComponent(query)}&type=video&key=${YOUTUBE_API_KEY}`);
            const data = await resp.json();
            resultsDiv.innerHTML = "";
            
            data.items.forEach(item => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'search-item';
                itemDiv.onclick = () => loadPlayer(id, 'youtube', item.id.videoId, item.snippet.title);
                itemDiv.innerHTML = `
                    <img src="${item.snippet.thumbnails.default.url}">
                    <div><strong>${item.snippet.title}</strong><br><small>${item.snippet.channelTitle}</small></div>
                `;
                resultsDiv.appendChild(itemDiv);
            });
            // Cache the results HTML so we can go back to it
            historyCache[id] = document.getElementById(`search-ui-${id}`).innerHTML;
        } catch (e) { resultsDiv.innerHTML = "Error. Verify your API Key."; }
    }

    function loadPlayer(id, platform, videoId, customTitle) {
        const content = document.getElementById(`c-${id}`);
        const title = document.getElementById(`t-${id}`);
        const backBtn = document.getElementById(`back-${id}`);
        
        // Ensure we cache the UI state before clearing
        if (!historyCache[id]) {
            historyCache[id] = content.innerHTML;
        }

        let url = "";
        if (platform === 'youtube') url = `https://www.youtube.com/embed/${videoId}?autoplay=1`;
        if (platform === 'twitch') {
            const host = window.location.hostname || "localhost";
            url = `https://player.twitch.tv/?channel=${videoId}&parent=${host}&autoplay=true`;
        }

        title.innerText = customTitle ? customTitle.substring(0, 18) + "..." : platform.toUpperCase();
        content.innerHTML = `<iframe src="${url}" allow="autoplay; fullscreen" allowfullscreen></iframe>`;
        backBtn.style.display = "block";
    }

    function goBack(id) {
        const content = document.getElementById(`c-${id}`);
        const title = document.getElementById(`t-${id}`);
        const backBtn = document.getElementById(`back-${id}`);

        if (historyCache[id]) {
            content.innerHTML = `<div class="search-container" id="search-ui-${id}">${historyCache[id]}</div>`;
            title.innerText = "Search";
            backBtn.style.display = "none";
        }
    }

    function togglePiP(win) {
        win.classList.toggle('pip-mode');
        if (win.classList.contains('pip-mode')) workspace.appendChild(win);
    }

    function applyLayout(cols, rows) {
        const windows = document.querySelectorAll('.v-window:not(.pip-mode)');
        const gap = 15;
        const wW = workspace.clientWidth - gap, wH = workspace.clientHeight - gap;
        const winW = (wW / cols) - gap, winH = (wH / rows) - gap;
        windows.forEach((win, i) => {
            if (i < (cols * rows)) {
                const c = i % cols, r = Math.floor(i / cols);
                win.style.width = winW + 'px'; win.style.height = winH + 'px';
                win.style.left = (gap + (c * (winW + gap))) + 'px';
                win.style.top = (gap + (r * (winH + gap))) + 'px';
            }
        });
    }

    function initDrag(win) {
        const h = win.querySelector('.v-header');
        h.onmousedown = (e) => {
            if (e.target.tagName === 'BUTTON' || win.classList.contains('pip-mode')) return;
            win.classList.add('no-transition', 'overlay-active');
            let ox = e.clientX - win.offsetLeft, oy = e.clientY - win.offsetTop;
            const m = (me) => { win.style.left = (me.clientX - ox) + 'px'; win.style.top = (me.clientY - oy) + 'px'; };
            const u = () => { win.classList.remove('no-transition', 'overlay-active'); window.removeEventListener('mousemove', m); };
            window.addEventListener('mousemove', m); window.addEventListener('mouseup', u);
        };
    }

    function initResize(win) {
        win.querySelectorAll('.resizer').forEach(r => {
            r.onmousedown = (e) => {
                if(win.classList.contains('pip-mode')) return;
                e.preventDefault();
                win.classList.add('no-transition', 'overlay-active');
                let sW = win.offsetWidth, sH = win.offsetHeight, sX = e.clientX, sY = e.clientY, sL = win.offsetLeft, sT = win.offsetTop;
                const m = (me) => {
                    const dX = me.clientX - sX, dY = me.clientY - sY;
                    if (r.classList.contains('e')) win.style.width = sW + dX + 'px';
                    if (r.classList.contains('w')) { win.style.width = sW - dX + 'px'; win.style.left = sL + dX + 'px'; }
                    if (r.classList.contains('s')) win.style.height = sH + dY + 'px';
                    if (r.classList.contains('n')) { win.style.height = sH - dY + 'px'; win.style.top = sT + dY + 'px'; }
                    if (r.classList.contains('se')) { win.style.width = sW + dX + 'px'; win.style.height = sH + dY + 'px'; }
                    if (r.classList.contains('sw')) { win.style.width = sW - dX + 'px'; win.style.left = sL + dX + 'px'; win.style.height = sH + dY + 'px'; }
                    if (r.classList.contains('ne')) { win.style.width = sW + dX + 'px'; win.style.height = sH - dY + 'px'; win.style.top = sT + dY + 'px'; }
                    if (r.classList.contains('nw')) { win.style.width = sW - dX + 'px'; win.style.left = sL + dX + 'px'; win.style.height = sH - dY + 'px'; win.style.top = sT + dY + 'px'; }
                };
                const u = () => { win.classList.remove('no-transition', 'overlay-active'); window.removeEventListener('mousemove', m); };
                window.addEventListener('mousemove', m); window.addEventListener('mouseup', u);
            };
        });
    }
</script>
</body>

</html>
